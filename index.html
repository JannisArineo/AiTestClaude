<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    .glow-ring {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 80, 255, 0.25), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    p {
      margin-top: 1rem;
      font-size: 1.1rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .dots {
      margin-top: 2.5rem;
      display: flex;
      gap: 10px;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) { background: #a78bfa; animation-delay: 0s; }
    .dot:nth-child(2) { background: #60a5fa; animation-delay: 0.2s; }
    .dot:nth-child(3) { background: #34d399; animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40%            { transform: translateY(-12px); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.8; }
      50%       { transform: translate(-50%, -50%) scale(1.15); opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow-ring"></div>
    <h1>Hello World</h1>
    <p>Welcome to my website</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
